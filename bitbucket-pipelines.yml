image: python:3.12-slim

definitions:
  caches:
    uv: ~/.cache/uv
    npm: ~/.npm
  steps:
    - step: &backend-quality
        name: Backend quality gates (lint, typecheck, unit, contract, integration, security, replay)
        caches:
          - uv
        script:
          - pip install uv
          - cd backend
          - uv sync --extra dev --frozen
          - uv run ruff check src tests
          - uv run mypy
          - uv run pytest tests/unit -q
          - uv run pytest tests/contract -q
          - uv run pytest tests/integration -q
          - uv run pytest tests/security -q
          - uv run pytest tests/replay -q
    - step: &frontend-quality
        name: Frontend quality gates (typecheck, test, build)
        image: node:22-alpine
        caches:
          - npm
        script:
          - cd frontend
          - npm ci
          - npm run typecheck
          - npm test
          - npm run build
    - step: &artifact-validation
        name: Contract and schema validation
        caches:
          - uv
        script:
          - pip install uv
          - cd backend
          - uv sync --extra dev --frozen
          - uv run pytest tests/contract/test_spec_contracts.py -q

pipelines:
  default:
    - parallel:
        - step: *backend-quality
        - step: *frontend-quality
        - step: *artifact-validation
