services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trade_ops
      POSTGRES_PASSWORD: trade_ops_dev_password
      POSTGRES_DB: trade_operations_settlement
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_ops -d trade_operations_settlement"]
      interval: 5s
      timeout: 5s
      retries: 5

  objectstore:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./backend
    environment:
      TRADE_OPS_ENVIRONMENT: synthetic
      TRADE_OPS_DATABASE_URL: postgresql://trade_ops:trade_ops_dev_password@db:5432/trade_operations_settlement
      TRADE_OPS_OBJECT_STORE_ENDPOINT: http://objectstore:9000
      TRADE_OPS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  console:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
