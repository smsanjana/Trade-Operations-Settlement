asyncapi: 2.6.0
info:
  title: Trade Operations and Settlement Event Contracts
  version: 1.0.0
  description: >-
    Versioned intake, workflow, posting, and reconciliation events. Events carry references and
    hashes rather than unrestricted evidence content. Producers use a transactional outbox and
    consumers enforce idempotency.
defaultContentType: application/json
channels:
  trade-operations.intake.v1:
    publish:
      operationId: acceptIntakeEvent
      message:
        oneOf:
          - $ref: '#/components/messages/SettlementExceptionReceived'
          - $ref: '#/components/messages/CorporateActionReceived'
  trade-operations.case-events.v1:
    subscribe:
      operationId: consumeCaseEvent
      message:
        $ref: '#/components/messages/CaseEvent'
  trade-operations.posting-instructions.v1:
    subscribe:
      operationId: consumePostingInstruction
      description: Consumed only by the separately privileged posting service.
      message:
        $ref: '#/components/messages/PostingInstructionCreated'
  trade-operations.posting-results.v1:
    publish:
      operationId: acceptPostingResult
      message:
        $ref: '#/components/messages/PostingResultReceived'
components:
  messages:
    SettlementExceptionReceived:
      name: SettlementExceptionReceived
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              event_type: { const: settlement.exception.received }
              data: { $ref: '#/components/schemas/SettlementExceptionData' }
    CorporateActionReceived:
      name: CorporateActionReceived
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              event_type: { const: corporate_action.received }
              data: { $ref: '#/components/schemas/CorporateActionData' }
    CaseEvent:
      name: CaseEvent
      payload:
        allOf:
          - $ref: '#/components/schemas/CaseEventEnvelope'
          - type: object
            properties:
              event_type:
                enum:
                  - intake.accepted
                  - intake.deduplicated
                  - evidence.retained
                  - evidence.screened
                  - evidence.blocked
                  - finding.recorded
                  - calculation.completed
                  - calculation.failed
                  - policy.evaluated
                  - approval.recorded
                  - amendment.recorded
                  - rejection.recorded
                  - voluntary_instruction.recorded
                  - posting.reconciliation_required
                  - posting.reconciliation_resolved
                  - evaluation.completed
                  - release.eligible
                  - release.blocked
              data:
                type: object
                additionalProperties: true
                description: Event-specific metadata and immutable references; no raw evidence body.
    PostingInstructionCreated:
      name: PostingInstructionCreated
      payload:
        allOf:
          - $ref: '#/components/schemas/CaseEventEnvelope'
          - type: object
            properties:
              event_type: { const: posting.instruction.created }
              data: { $ref: '#/components/schemas/PostingInstructionData' }
    PostingResultReceived:
      name: PostingResultReceived
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              event_type: { const: posting.result.received }
              data: { $ref: '#/components/schemas/PostingResultData' }
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - schema_version
        - source_system
        - source_event_id
        - idempotency_key
        - occurred_at
        - correlation_id
        - data
      properties:
        event_id: { type: string, minLength: 1 }
        event_type: { type: string, minLength: 1 }
        schema_version: { type: string, const: '1.0' }
        source_system: { type: string, minLength: 1 }
        source_event_id: { type: string, minLength: 1 }
        idempotency_key: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string, minLength: 1 }
        causation_id: { type: [string, 'null'] }
        case_id: { type: string, minLength: 1 }
        workflow_run_id: { type: string, minLength: 1 }
        case_version: { type: integer, minimum: 1 }
        data: {}
    CaseEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [case_id, workflow_run_id, case_version]
          properties:
            case_id: { type: string, minLength: 1 }
            workflow_run_id: { type: string, minLength: 1 }
            case_version: { type: integer, minimum: 1 }
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Hash:
      type: object
      additionalProperties: false
      required: [algorithm, digest]
      properties:
        algorithm: { type: string, const: sha256 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [evidence_id, content_hash, source_name, locator]
      properties:
        evidence_id: { type: string }
        content_hash: { $ref: '#/components/schemas/Hash' }
        source_name: { type: string }
        locator:
          type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: { type: string, enum: [message, page, field, json_pointer, record] }
            value: { type: string }
    SettlementExceptionData:
      type: object
      additionalProperties: false
      required: [exception_type, booked_trade_reference, value]
      properties:
        exception_type:
          type: string
          enum: [fee, commission, settlement_date, ssi, unknown]
        booked_trade_reference: { type: string }
        value: { $ref: '#/components/schemas/Money' }
        evidence_references:
          type: array
          items: { $ref: '#/components/schemas/EvidenceReference' }
    CorporateActionData:
      type: object
      additionalProperties: false
      required: [event_reference, event_type, mandatory_or_voluntary, instrument_id, evidence_references]
      properties:
        event_reference: { type: string }
        event_type: { type: string }
        mandatory_or_voluntary: { type: string, enum: [mandatory, voluntary] }
        instrument_id: { type: string }
        deadline_at: { type: [string, 'null'], format: date-time }
        evidence_references:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EvidenceReference' }
    PostingInstructionData:
      type: object
      additionalProperties: false
      required:
        - posting_instruction_id
        - posting_idempotency_key
        - proposal_id
        - proposal_version
        - payload_hash
        - authorization_class
        - authorization_reference
        - account_id
        - direction
        - amount
        - value_date
        - reason_code
      properties:
        posting_instruction_id: { type: string }
        posting_idempotency_key: { type: string }
        proposal_id: { type: string }
        proposal_version: { type: integer, minimum: 1 }
        payload_hash: { $ref: '#/components/schemas/Hash' }
        authorization_class: { type: string, enum: [autonomous, human_approved] }
        authorization_reference: { type: string }
        account_id: { type: string }
        direction: { type: string, enum: [debit, credit] }
        amount: { $ref: '#/components/schemas/Money' }
        value_date: { type: string, format: date }
        reason_code: { type: string }
    PostingResultData:
      type: object
      additionalProperties: false
      required: [posting_instruction_id, posting_idempotency_key, status, acknowledged_at]
      properties:
        posting_instruction_id: { type: string }
        posting_idempotency_key: { type: string }
        status: { type: string, enum: [acknowledged, rejected, outcome_unknown] }
        external_reference: { type: [string, 'null'] }
        reason_code: { type: [string, 'null'] }
        acknowledged_at: { type: string, format: date-time }
        original_result_hash:
          anyOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
x-contract-invariants:
  - A duplicate intake idempotency key resolves to the existing case and cannot start another posting path.
  - A duplicate posting idempotency key returns the original recorded result and cannot cause another ledger action.
  - Unknown event schema versions fail closed into a reviewable or dead-letter state with an audit record.
  - Case and posting events never embed unrestricted evidence content or credentials.
  - Posting instructions are emitted only from the transactional outbox after authorization is committed.
